name: Import SMART AI GAME LAB sources
on:
  push:
    paths:
      - "_import/chunk07.b64"
      - ".github/workflows/import-sources.yml"

permissions:
  contents: write

jobs:
  unpack-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reassemble source archive and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          for n in 00 01 02 03 04 05 06 07; do
            cat "_import/chunk${n}.b64"
          done | base64 -d > project.tar.xz
          echo "035c6c7b119919acfb7153279ac015db802d25ff0000aa1ae3be97ab0b644ba1  project.tar.xz" | sha256sum -c -
          tar -tJf project.tar.xz
          tar -xJf project.tar.xz
          rm project.tar.xz
      - name: Run Node.js automated tests
        run: npm test
      - name: Commit expanded sources and remove temporary installer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _import
          rm -f .github/workflows/import-sources.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: import SMART AI GAME LAB v0.1 source files"
            git push origin HEAD:main
          fi
