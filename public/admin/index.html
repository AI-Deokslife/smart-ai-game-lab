<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1227"><title>관리자 | SMART AI GAME LAB</title>
<style>
:root{color-scheme:dark;font-family:Pretendard,'Malgun Gothic',system-ui,sans-serif;background:#0b1125;color:#eef5ff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1080px;margin:0 auto;padding:30px 22px 80px}.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:46px}a{color:#9df6e4;text-decoration:none}.brand{font-weight:900;letter-spacing:.02em;font-size:15px}h1{font-size:clamp(29px,6vw,42px);letter-spacing:-.06em;margin:0 0 9px}p{color:#aebcda;line-height:1.7}label{font-size:12px;color:#aebcda;display:block;margin-bottom:9px}input{width:100%;min-width:0;border:1px solid #ffffff28;background:#1c2748;border-radius:13px;color:#fff;font:inherit;padding:14px}button{border:0;background:#91eae2;color:#12243e;font:inherit;font-weight:850;border-radius:12px;padding:14px 20px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.login{border:1px solid #ffffff1e;background:#151e3c;border-radius:22px;padding:23px;margin-top:24px;max-width:650px}.input-row{display:flex;gap:10px}.notice{font-size:12px;color:#b1d8eb;padding-top:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:25px 0}.metric{border:1px solid #ffffff20;background:#182440;border-radius:15px;padding:20px}.metric strong{font-size:30px;display:block;margin-bottom:5px}.metric small{color:#aebcda}section{margin-top:25px}.tablewrap{overflow:auto;border:1px solid #ffffff23;border-radius:16px;background:#151e36}table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}th,td{padding:15px;border-bottom:1px solid #ffffff14;white-space:nowrap}th{color:#9eb2d6;background:#202b47;font-size:11px}td:last-child{text-align:right}td button{background:#782a45;color:#fff;padding:9px 12px;font-size:11px}.muted{color:#97a7c6}.hint{background:#1a2740;border-radius:12px;padding:14px;font-size:12px}.hidden{display:none}@media(max-width:600px){.wrap{padding:21px 14px}.input-row{flex-direction:column}.stats{gap:7px}.metric{padding:12px}.metric strong{font-size:23px}}
</style></head>
<body><main class="wrap"><div class="nav"><a class="brand" href="/">← SMART AI GAME LAB</a><span class="muted">ADMIN CONSOLE</span></div>
<h1>게임 운영 관리</h1><p>운영 통계와 최근 점수를 확인하고 비정상 기록을 삭제할 수 있습니다.</p>
<div class="login"><label for="adminKey">관리자 보안 키 (Cloudflare Secret `ADMIN_KEY`)</label><div class="input-row"><input id="adminKey" type="password" autocomplete="off" placeholder="관리자 키를 입력하세요"><button id="signin" type="button">관리자 접속</button></div><div id="status" class="notice">보안 키는 화면을 새로고침하면 지워집니다. GitHub 코드에는 입력하지 마세요.</div></div>
<div id="dashboard" class="hidden"><div class="stats"><div class="metric"><strong id="players">–</strong><small>총 참가자</small></div><div class="metric"><strong id="scores">–</strong><small>저장된 기록</small></div><div class="metric"><strong id="sessions">–</strong><small>시작된 게임</small></div></div>
<section><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2>최근 게임 기록</h2><button id="refresh" type="button">새로고침</button></div><div class="tablewrap"><table><thead><tr><th>닉네임</th><th>게임</th><th>모드</th><th>점수</th><th>층수</th><th>기록 시각 (UTC)</th><th>관리</th></tr></thead><tbody id="scoresBody"><tr><td colspan="7">기록 조회 중…</td></tr></tbody></table></div></section>
<p class="hint">기록 삭제 시 복구할 수 없습니다. 개인정보를 수집하지 않는 익명 시스템으로 운영하며, 현재 버전의 점수 검증은 기본적인 범위·시간 검증입니다.</p></div>
</main><script>
const $=id=>document.getElementById(id);let key='';
async function api(path,options={}){const response=await fetch(path,{...options,headers:{'X-Admin-Key':key,...(options.headers||{})},cache:'no-store'});const data=await response.json();if(!response.ok)throw new Error(data.error||'요청 실패');return data;}
async function load(){const [stats,records]=await Promise.all([api('/api/admin/summary'),api('/api/admin/scores')]);for(const k of ['players','scores','sessions'])$(k).textContent=stats[k].toLocaleString('ko-KR');const body=$('scoresBody');body.replaceChildren();if(!records.scores.length){const tr=document.createElement('tr');const td=document.createElement('td');td.colSpan=7;td.textContent='아직 기록이 없습니다.';tr.append(td);body.append(tr);return;}for(const record of records.scores){const tr=document.createElement('tr');for(const content of [record.nickname,record.game_id,record.mode,record.score.toLocaleString('ko-KR'),record.floors,record.created_at]){const td=document.createElement('td');td.textContent=content;tr.append(td);}const td=document.createElement('td'),button=document.createElement('button');button.textContent='삭제';button.addEventListener('click',async()=>{if(!confirm(record.nickname+'의 '+record.score+'점 기록을 삭제하시겠습니까?'))return;try{await api('/api/admin/scores/'+encodeURIComponent(record.id),{method:'DELETE'});await load();}catch(e){alert(e.message);}});td.append(button);tr.append(td);body.append(tr);}}
$('signin').addEventListener('click',async()=>{key=$('adminKey').value.trim();if(!key){$('status').textContent='관리자 키를 입력하세요.';return;}$('status').textContent='접속 확인 중…';try{await load();$('dashboard').classList.remove('hidden');$('status').textContent='관리자 인증 완료. 키는 현재 페이지 메모리에만 보관됩니다.';$('adminKey').value='';}catch(e){key='';$('dashboard').classList.add('hidden');$('status').textContent='접속 실패: '+e.message;}});
$('refresh').addEventListener('click',()=>load().catch(e=>alert(e.message)));
</script></body></html>
